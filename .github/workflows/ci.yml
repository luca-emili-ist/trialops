name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # Since 2026-10-10 `npm run verify` hangs in CI until GitHub's 6 h limit (≈360 billed min per push).
    # Cap it until the hang is fixed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci || npm install
      - run: npm run db:reset
      # verify = lint (incl. AI-01 provider boundary) + typecheck + tests + traceability
      - run: npm run verify
        env:
          TRIALOPS_GATE: foundations,v0,gxp-p0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            test-results.xml
            docs/traceability.md
