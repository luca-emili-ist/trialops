name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # A run takes ~2 min. The cap stops a hang from billing up to GitHub's 6 h limit (it happened 2026-10-10..17:
    # scripts/db.mjs blocked its event loop with spawnSync and the embedded Postgres stalled on its log pipe).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: npm ci || npm install
      - run: npm run db:reset
      # verify = lint (incl. AI-01 provider boundary) + typecheck + tests + traceability
      - run: npm run verify
        env:
          TRIALOPS_GATE: foundations,v0,gxp-p0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            test-results.xml
            docs/traceability.md
