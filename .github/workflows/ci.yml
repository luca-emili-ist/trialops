name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # A run takes ~2 min. The cap stops a hang from billing up to GitHub's 6 h limit (it happened 2026-10-10..17:
    # scripts/db.mjs blocked its event loop with spawnSync and the embedded Postgres stalled on its log pipe).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: npm ci || npm install
      - run: npm run db:reset
      # verify = lint (incl. AI-01 provider boundary) + typecheck + tests + traceability
      - run: npm run verify
        env:
          TRIALOPS_GATE: foundations,v0,gxp-p0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-evidence-${{ github.sha }}
          path: |
            test-results.xml
            docs/traceability.md
