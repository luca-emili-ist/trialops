# Mutation testing (shared template, installed by ~/Documents/Claude/scripts/ci/install-ci.py — do not edit
# here, edit the template and re-install). Installed only in repos that have a stryker.config.json at the root:
# that file says which modules to mutate (testRunner vitest, reporters must include "json").
# Weekly, report-only: the mutation score goes to the job summary (and a notice annotation) and the JSON report is kept 30 days as an
# artifact; the run never fails on a low score. Stryker is installed with --no-save at a pinned version.
name: mutation

on:
  schedule:
    - cron: '23 4 * * 0'   # weekly, Sunday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  STRYKER_VERSION: '9.6.1'

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i --no-save --no-audit --no-fund "@stryker-mutator/core@${STRYKER_VERSION}" "@stryker-mutator/vitest-runner@${STRYKER_VERSION}"
      - name: Stryker
        run: npx stryker run || echo "::warning::Stryker run failed (report-only)"
      - name: Mutation score
        if: always()
        run: |
          node -e '
            const fs = require("fs"), f = "reports/mutation/mutation.json";
            if (!fs.existsSync(f)) { console.log("no report"); process.exit(0); }
            const files = JSON.parse(fs.readFileSync(f, "utf8")).files, c = {}, rows = [];
            const score = s => { const d = (s.Killed||0)+(s.Timeout||0), n = d+(s.Survived||0)+(s.NoCoverage||0); return n ? (100*d/n).toFixed(1) : "-"; };
            for (const [p, v] of Object.entries(files)) {
              const s = {}; for (const m of v.mutants) { s[m.status] = (s[m.status]||0)+1; c[m.status] = (c[m.status]||0)+1; }
              rows.push(`| ${p} | ${score(s)} | ${s.Killed||0} | ${s.Survived||0} | ${s.NoCoverage||0} |`);
            }
            const out = [`### Mutation score: ${score(c)}%`, "", "| File | Score % | Killed | Survived | No coverage |", "|---|---|---|---|---|", ...rows].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n"); console.log(out);
            console.log(`::notice title=Mutation score::Mutation score: ${score(c)}%`);  // read by quality-collect.py
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
          if-no-files-found: ignore
